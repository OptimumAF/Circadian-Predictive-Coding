name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests scripts

      - name: Test
        run: pytest -q

  torch-cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The CPU index supplies matching Torch and torchvision wheels without CUDA dependencies.
          python -m pip install -r requirements-resnet.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Verify CPU backend
        run: |
          python -c "import torch, torchvision; assert torch.version.cuda is None, 'Expected CPU-only Torch wheel'; print('Torch', torch.__version__, 'torchvision', torchvision.__version__)"

      - name: Test Torch suites
        run: pytest -q -ra --junitxml=torch-cpu.xml tests/test_resnet50_variants.py tests/test_resnet50_benchmark.py tests/test_matched_head_benchmark.py tests/test_matched_head_capacity.py tests/test_isolated_head_memory.py tests/test_matched_head_tuning.py tests/test_repeated_head_confirmation.py tests/test_process_memory.py tests/test_phase6_isolated_memory_cli_smoke.py tests/test_phase6_multiseed_cli_smoke.py tests/test_cifar_representative_confirmation.py tests/test_cifar_representative_feasibility.py tests/test_cifar_representative_restore.py tests/test_cifar_representative_selection.py tests/test_cifar_representative_study.py

      - name: Require Torch coverage without skips
        run: python -c "import xml.etree.ElementTree as ET; suites = list(ET.parse('torch-cpu.xml').iter('testsuite')); assert suites and all(int(s.get('skipped', '0')) == 0 for s in suites), 'Required CPU tests were skipped'"

  windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check both platform type boundaries
        run: |
          python -m mypy --platform win32 src tests scripts
          python -m mypy --platform linux src tests scripts
      - name: Record Windows native CI environment
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'circadian-windows-native'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $facts = @{ role = 'Pre-test runner snapshot; does not measure contention during native captures' }
          try {
            $machine = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            $system = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            $facts.logical_processors = $machine.NumberOfLogicalProcessors
            $facts.physical_memory_bytes = $machine.TotalPhysicalMemory
            $facts.free_memory_kib = $system.FreePhysicalMemory
            $facts.os_caption = $system.Caption
            $facts.os_version = $system.Version
            $facts.os_build = $system.BuildNumber
          } catch {
            $facts.snapshot_error_type = $_.Exception.GetType().FullName
          }
          $facts | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $folder 'runner-before.json') -Encoding utf8
          @'
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import sysconfig
          
          versions = {}
          for name in ("numpy", "Pillow", "pytest", "pluggy", "ruff", "mypy", "librt"):
              try:
                  versions[name] = metadata.version(name)
              except metadata.PackageNotFoundError:
                  versions[name] = None
          plugins = sorted(entry.name for entry in metadata.entry_points(group="pytest11"))
          source_paths = [
              "src/infra/runtime_python_objects.py",
              "src/infra/runtime_python_retention.py",
              "tests/test_prospective_runtime_closure.py",
              "tests/test_runtime_execution_guard.py",
              "tests/prospective_runtime_fixtures.py",
              "tests/runtime_execution_guard_fixtures.py",
              "pyproject.toml", "requirements.txt",
          ]
          row = {
              "role": "software CI environment diagnostic; no source or scientific admission",
              "python": sys.version, "executable_basename": Path(sys.executable).name,
              "implementation": platform.python_implementation(),
              "architecture": platform.architecture(),
              "gil_enabled": getattr(sys, "_is_gil_enabled", lambda: None)(),
              "free_threaded_build": sysconfig.get_config_var("Py_GIL_DISABLED"),
              "logical_cpu_count": os.cpu_count(),
              "process_cpu_count": getattr(os, "process_cpu_count", os.cpu_count)(),
              "versions": versions, "pytest_entrypoint_names": plugins,
              "allowlisted_environment_present": {
                  name: name in os.environ
                  for name in ("PYTEST_ADDOPTS", "PYTEST_DISABLE_PLUGIN_AUTOLOAD", "PYTHONHASHSEED",
                               "OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS")
              },
              "selected_physical_source_sha256": {
                  name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for name in source_paths
              },
          }
          folder = Path(os.environ["RUNNER_TEMP"]) / "circadian-windows-native"
          folder.mkdir(exist_ok=True)
          (folder / "python-environment.json").write_text(json.dumps(row, indent=2), encoding="utf-8")
          print(json.dumps(row, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native ownership and runtime observations
        shell: pwsh
        run: |
          $interpreter = (Get-Command python -ErrorAction Stop).Source
          $testArguments = @(
            '-m'
            'pytest'
            '-q'
            '-ra'
            'tests/test_platform_boundaries.py'
            'tests/test_prospective_generation_ownership.py'
            'tests/test_prospective_runtime_closure.py'
            'tests/test_runtime_payload_schema.py'
            'tests/test_runtime_python_retention.py'
            'tests/test_runtime_admission_limits.py'
            'tests/test_runtime_monitoring_coverage.py'
            'tests/test_runtime_execution_guard.py'
            '--durations=0'
            '--junitxml=${{ runner.temp }}/circadian-windows-native/tests.raw.xml'
          )
          $receiptFolder = Join-Path $env:RUNNER_TEMP 'circadian-windows-native'
          $ErrorActionPreference = 'Stop'
          $SamplePeriodSeconds = 5
          $SamplingLimitSeconds = 900
          $MaxSamples = 4096
          $MaxChildren = 256
          if ($SamplePeriodSeconds -le 0 -or $SamplingLimitSeconds -le 0 -or $MaxSamples -lt 1 -or $MaxChildren -lt 1) { throw 'Invalid sampler bounds' }
          New-Item -ItemType Directory -Path $ReceiptFolder -Force | Out-Null
          $samplePath = Join-Path $ReceiptFolder 'owned-child-samples.jsonl'
          $writer = [IO.StreamWriter]::new($samplePath, $false, [Text.UTF8Encoding]::new($false))
          # Arguments are supplied by the fixed workflow, not process command-line reads.
          $quotedArguments = foreach ($argument in $TestArguments) {
            '"' + ([regex]::Replace(([regex]::Replace($argument, '(\\*)"', '$1$1\"')), '(\\+)$', '$1$1')) + '"'
          }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $root = Start-Process -FilePath $Interpreter -ArgumentList ($quotedArguments -join ' ') -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $ReceiptFolder 'tests.output.txt') -RedirectStandardError (Join-Path $ReceiptFolder 'tests.error.txt')
          $runner = $root
          $rootCreated = $root.StartTime.ToUniversalTime()
          $forwardingLauncher = Test-Path -LiteralPath (Join-Path (Split-Path (Split-Path $Interpreter -Parent) -Parent) 'pyvenv.cfg')
          $children = [Collections.Generic.List[object]]::new()
          $errors = [Collections.Generic.List[string]]::new()
          $properties = @('ProcessId','ParentProcessId','CreationDate','Name','UserModeTime','KernelModeTime','WorkingSetSize','PrivatePageCount','ReadTransferCount','WriteTransferCount')
          $samples = 0
          $probeSeconds = 0.0
          $maxProbeSeconds = 0.0
          $boundsReached = $false
          $nextProbe = 0.0
          function Write-ChildRow($row) {
            if ($script:samples -ge $MaxSamples) { $script:boundsReached = $true; return }
            $writer.WriteLine(($row | ConvertTo-Json -Compress -Depth 5))
            $writer.Flush()
            $script:samples += 1
          }
          function Get-OwnRows([string]$Filter) {
            Get-CimInstance Win32_Process -Filter $Filter -Property $properties -ErrorAction Stop
          }
          try {
            while (-not $root.HasExited) {
              if ($clock.Elapsed.TotalSeconds -ge $SamplingLimitSeconds -or $samples -ge $MaxSamples -or $children.Count -ge $MaxChildren -or $errors.Count -ge 3) { $boundsReached = $true; break }
              if ($clock.Elapsed.TotalSeconds -lt $nextProbe) { [void]$root.WaitForExit(200); continue }
              $probeClock = [Diagnostics.Stopwatch]::StartNew()
              try {
                if ($forwardingLauncher) {
                  # CPython venv forwarders create the real pytest interpreter first.
                  $forwardRows = @(Get-OwnRows "ParentProcessId = $($root.Id)")
                  $forwardRows = @($forwardRows | Where-Object { $_.Name -in @('python.exe','pythonw.exe') -and $_.CreationDate.ToUniversalTime() -ge $rootCreated })
                  if ($forwardRows.Count -eq 1) {
                    $candidateRunner = [Diagnostics.Process]::GetProcessById([int]$forwardRows[0].ProcessId)
                    [void]$candidateRunner.Handle
                    if ([math]::Abs(($candidateRunner.StartTime.ToUniversalTime() - $forwardRows[0].CreationDate.ToUniversalTime()).Ticks) -le 10000 -and -not $root.HasExited) { $runner = $candidateRunner; $forwardingLauncher = $false }
                  }
                }
                if (-not $forwardingLauncher -and -not $runner.HasExited) {
                  $observedRows = @{}
                  $parents = @(@{ Handle = $runner; Created = $runner.StartTime.ToUniversalTime(); Depth = 0 }) + @($children | Where-Object { -not $_.ExitRecorded })
                  foreach ($parent in $parents) {
                    if ($parent.Handle.HasExited) { continue }
                    $rows = @(Get-OwnRows "ParentProcessId = $($parent.Handle.Id)")
                    if ($parent.Handle.HasExited) { continue }
                    foreach ($row in $rows) {
                      if ($row.Name -notin @('python.exe','pythonw.exe') -or $row.CreationDate.ToUniversalTime() -lt $parent.Created) { continue }
                      $observedRows["$($row.ProcessId):$($row.CreationDate.ToUniversalTime().Ticks)"] = $row
                      $known = @($children | Where-Object { $_.Id -eq [int]$row.ProcessId -and $_.Created -eq $row.CreationDate.ToUniversalTime() })
                      if ($known.Count -eq 0 -and $children.Count -lt $MaxChildren) {
                        try {
                          $handle = [Diagnostics.Process]::GetProcessById([int]$row.ProcessId)
                          # Force a held OS handle; a reused PID cannot replace this child.
                          [void]$handle.Handle
                          if ([math]::Abs(($handle.StartTime.ToUniversalTime() - $row.CreationDate.ToUniversalTime()).Ticks) -gt 10000 -or $handle.HasExited -or $parent.Handle.HasExited) { $handle.Dispose(); continue }
                          $entry = [pscustomobject]@{ Id=[int]$row.ProcessId; ParentId=$parent.Handle.Id; Created=$row.CreationDate.ToUniversalTime(); Handle=$handle; Depth=($parent.Depth+1); ExitRecorded=$false }
                          $children.Add($entry)
                        } catch [ArgumentException] { continue } catch [InvalidOperationException] { continue }
                      }
                    }
                  }
                  foreach ($child in $children) {
                    if ($child.ExitRecorded) { continue }
                    if ($child.Handle.HasExited) {
                      Write-ChildRow ([ordered]@{ elapsed_seconds=$clock.Elapsed.TotalSeconds; process_id=$child.Id; owned_parent_id=$child.ParentId; depth=$child.Depth; state='exited'; exit_code=$child.Handle.ExitCode })
                      $child.ExitRecorded = $true
                      continue
                    }
                    $rowKey = "$($child.Id):$($child.Created.Ticks)"
                    $row = if ($observedRows.ContainsKey($rowKey)) { @($observedRows[$rowKey]) } else { @(Get-OwnRows "ProcessId = $($child.Id)") }
                    if ($row.Count -ne 1 -or $row[0].CreationDate.ToUniversalTime() -ne $child.Created -or $child.Handle.HasExited) { continue }
                    $row = $row[0]
                    $child.Handle.Refresh()
                    Write-ChildRow ([ordered]@{ elapsed_seconds=$clock.Elapsed.TotalSeconds; process_id=$child.Id; owned_parent_id=$child.ParentId; depth=$child.Depth; state='running'; user_cpu_seconds=([double]$row.UserModeTime/10000000); kernel_cpu_seconds=([double]$row.KernelModeTime/10000000); working_set_bytes=[uint64]$row.WorkingSetSize; private_bytes=[uint64]$row.PrivatePageCount; observed_os_peak_working_set_bytes=$child.Handle.PeakWorkingSet64; io_read_bytes=[uint64]$row.ReadTransferCount; io_write_bytes=[uint64]$row.WriteTransferCount })
                  }
                }
              } catch { $errors.Add($_.Exception.GetType().FullName) }
              $probeClock.Stop()
              $probeSeconds += $probeClock.Elapsed.TotalSeconds
              $maxProbeSeconds = [math]::Max($maxProbeSeconds,$probeClock.Elapsed.TotalSeconds)
              $nextProbe = $clock.Elapsed.TotalSeconds + $SamplePeriodSeconds
            }
            # A sampler bound stops observation only; original test deadlines still own execution.
            $root.WaitForExit()
            foreach ($child in $children) {
              if (-not $child.ExitRecorded -and $child.Handle.HasExited) {
                Write-ChildRow ([ordered]@{ elapsed_seconds=$clock.Elapsed.TotalSeconds; process_id=$child.Id; owned_parent_id=$child.ParentId; depth=$child.Depth; state='exited'; exit_code=$child.Handle.ExitCode })
                $child.ExitRecorded = $true
              }
            }
            $summary = [ordered]@{ role='External owned-child software diagnostics; no causal or scientific admission'; period_seconds=$SamplePeriodSeconds; sampling_limit_seconds=$SamplingLimitSeconds; max_samples=$MaxSamples; max_children=$MaxChildren; samples=$samples; observed_children=$children.Count; probe_wall_seconds=$probeSeconds; maximum_probe_wall_seconds=$maxProbeSeconds; total_wall_seconds=$clock.Elapsed.TotalSeconds; bounds_reached=$boundsReached; error_types=@($errors); pytest_exit_code=$root.ExitCode; child_source_injection=$false; all_existing_test_deadlines_unchanged=$true; missed_short_children_possible=$true }
            $summary | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $ReceiptFolder 'owned-child-sampler.json') -Encoding utf8
            Get-Content -LiteralPath (Join-Path $ReceiptFolder 'tests.output.txt')
            Get-Content -LiteralPath (Join-Path $ReceiptFolder 'tests.error.txt')
            Write-Output ('SAMPLER ' + ($summary | ConvertTo-Json -Compress -Depth 5))
            $testExitCode = $root.ExitCode
          } finally {
            $writer.Dispose()
            foreach ($child in $children) { $child.Handle.Dispose() }
            if ($runner.Id -ne $root.Id) { $runner.Dispose() }
            $root.Dispose()
          }
          exit $testExitCode
      - name: Record Windows native CI post-test snapshot
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'circadian-windows-native'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $facts = @{ role = 'Post-test runner snapshot; cannot reconstruct child CPU or peak memory' }
          try {
            $system = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            $facts.free_memory_kib = $system.FreePhysicalMemory
          } catch {
            $facts.snapshot_error_type = $_.Exception.GetType().FullName
          }
          $facts | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $folder 'runner-after.json') -Encoding utf8
          @'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          folder = Path(os.environ["RUNNER_TEMP"]) / "circadian-windows-native"
          raw = folder / "tests.raw.xml"
          summary = {"role": "software test counts and durations; no source/native/scientific admission"}
          if raw.is_file():
              suites = list(ET.parse(raw).iter("testsuite"))
              summary["suites"] = [
                  {
                      "counts_and_time": {key: suite.attrib.get(key) for key in ("tests", "errors", "failures", "skipped", "time")},
                      "test_cases": [
                          {"name": case.attrib.get("name"), "classname": case.attrib.get("classname"),
                           "seconds": case.attrib.get("time"),
                           "outcome": "failed" if case.find("failure") is not None else "error" if case.find("error") is not None else "skipped" if case.find("skipped") is not None else "passed"}
                          for case in suite.findall("testcase")
                      ],
                  }
                  for suite in suites
              ]
          else:
              summary["junit_available"] = False
          (folder / "tests-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows native CI diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/circadian-windows-native/python-environment.json
            ${{ runner.temp }}/circadian-windows-native/runner-before.json
            ${{ runner.temp }}/circadian-windows-native/runner-after.json
            ${{ runner.temp }}/circadian-windows-native/tests-summary.json
            ${{ runner.temp }}/circadian-windows-native/owned-child-samples.jsonl
            ${{ runner.temp }}/circadian-windows-native/owned-child-sampler.json
          if-no-files-found: warn
          retention-days: 7
